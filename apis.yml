name: Sydecar
description: Sydecar is a deal execution platform for venture investors that automates
  the operational back office of Special Purpose Vehicles (SPVs) — banking, compliance,
  KYC/AML, contracts, capital calls, and investor reporting — so syndicate leads, emerging
  fund managers, venture firms, and family offices can launch and administer SPVs,
  syndicates, secondary SPVs, and layered SPVs in hours instead of weeks. Sydecar also
  publishes a developer API (api-docs.sydecar.io) for programmatically creating and
  managing SPVs, subscriptions, and documents.
